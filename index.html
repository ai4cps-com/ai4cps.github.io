<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="AI4CPS — Let us introduce you to AI."
    >

    <title>AI4CPS</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px;
            background: #010915;
            color: #ffffff;
            font-family: "Poppins", sans-serif;
        }

        main {
            width: 100%;
            max-width: 1100px;
            text-align: center;
        }

        .logo {
            display: block;
            width: min(420px, 80vw);
            height: auto;
            margin: 0 auto 64px;
        }

        h1 {
            margin: 0;
            font-family: "Archivo Black", sans-serif;
            font-size: clamp(42px, 8vw, 96px);
            line-height: 1.05;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        .highlight {
            color: #8f78fe;
        }

        .coming-soon {
            margin: 28px 0 0;
            color: rgba(255, 255, 255, 0.65);
            font-size: clamp(18px, 2vw, 26px);
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <main>
        <img
            class="logo"
            src="assets/logo-simplified.svg"
            alt="AI4CPS"
        >

        <h1>
            Let us introduce you to
            <span class="highlight">AI</span>...
        </h1>

        <p class="coming-soon">Coming soon</p>
    </main>
</body>
</html>
